name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tools/requirements.txt
      - name: Run unit tests (non-GUI)
        run: |
          python -m unittest tests.test_timer tests.test_vocab tests.test_fetch_random tests.test_pipeline -v

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone app
        run: |
          pyinstaller --noconfirm --clean \
            --name foklumi \
            --add-data "data/vocab.json:data" \
            --add-data "data/ATTRIBUTION.md:data" \
            main.py
          ARCHIVE="foklumi-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C dist foklumi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/foklumi-*.tar.gz
